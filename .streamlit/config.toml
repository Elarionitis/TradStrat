[client]
toolbarMode = "minimal"
# Visitors see a short message instead of a traceback if something unexpected fails.
showErrorDetails = "none"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 10
headless = true

[theme]
# A research-notebook look: a serif for headlines, a plain sans for reading, a mono for numbers.
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
headingFont = "Newsreader:https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
baseRadius = "0.3rem"
buttonRadius = "0.3rem"
headingFontWeights = [600, 600, 600, 600, 600, 600]
metricValueFontWeight = 500
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#f6f3ec"
secondaryBackgroundColor = "#ece8de"
textColor = "#16140f"
borderColor = "#dcd6c8"
dataframeBorderColor = "#dcd6c8"
linkColor = "#2468bd"
greenColor = "#0f7a3d"
redColor = "#c23b33"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#6250d6"]

[theme.light.sidebar]
backgroundColor = "#efebe2"
secondaryBackgroundColor = "#e4dfd3"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#13120f"
secondaryBackgroundColor = "#1f1d19"
textColor = "#ece6d8"
borderColor = "#2f2c26"
dataframeBorderColor = "#2f2c26"
linkColor = "#6aa3ea"
greenColor = "#3fae6a"
redColor = "#e66767"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#9085e9"]

[theme.dark.sidebar]
backgroundColor = "#181713"
secondaryBackgroundColor = "#24221d"
