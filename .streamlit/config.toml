[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 50

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseRadius = "0.6rem"
buttonRadius = "0.6rem"
headingFontWeights = [700, 600, 600, 600, 600, 600]
metricValueFontWeight = 600
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"
dataframeBorderColor = "#e1e0d9"
linkColor = "#256abf"
greenColor = "#0ca30c"
redColor = "#d03b3b"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#6250d6"]

[theme.light.sidebar]
backgroundColor = "#f2f1ed"
secondaryBackgroundColor = "#e8e7e2"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#0f0f0e"
secondaryBackgroundColor = "#1f1f1d"
textColor = "#f0efec"
borderColor = "#2c2c2a"
dataframeBorderColor = "#2c2c2a"
linkColor = "#5598e7"
greenColor = "#0ca30c"
redColor = "#e66767"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#9085e9"]

[theme.dark.sidebar]
backgroundColor = "#151514"
secondaryBackgroundColor = "#242422"
