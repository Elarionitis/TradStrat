[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tradstrat"
description = "An event-driven backtester that tests whether a trading strategy's results can be believed."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dynamic = ["version", "dependencies"]
keywords = [
    "backtesting",
    "trading",
    "quantitative-finance",
    "walk-forward",
    "overfitting",
    "deflated-sharpe-ratio",
    "streamlit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Elarionitis/TradStrat"
Documentation = "https://github.com/Elarionitis/TradStrat/blob/main/docs/METHODOLOGY.md"
Changelog = "https://github.com/Elarionitis/TradStrat/blob/main/CHANGELOG.md"
Issues = "https://github.com/Elarionitis/TradStrat/issues"

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pandas-stubs",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
tradstrat = "tradstrat.cli:main"

[tool.setuptools]
packages = ["tradstrat", "tradstrat.sample_data"]

[tool.setuptools.package-data]
"tradstrat" = ["py.typed"]
"tradstrat.sample_data" = ["*.csv"]

[tool.setuptools.dynamic]
version = { attr = "tradstrat.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    # yfinance's cache (via peewee) leaves sqlite connections open; Python 3.13+ warns about it.
    "ignore:unclosed database in <sqlite3.Connection:ResourceWarning",
]

[tool.coverage.run]
source = ["tradstrat"]
branch = true
omit = ["tradstrat/__main__.py"]


[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PD", "NPY", "RUF"]


[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
"tradstrat/glossary.py" = ["E501"]
"scripts/mutation_check.py" = ["E501"]
"scripts/run_research.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["tradstrat"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["plotly.*", "yfinance.*"]
ignore_missing_imports = true
